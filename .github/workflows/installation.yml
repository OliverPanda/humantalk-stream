name: Installation compatibility
on:
  push:
  pull_request:
jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,cloud,local]" uv
      - name: Test recommendation, configuration and Web API
        run: python -m pytest tests/test_installation.py tests/test_hardware_and_cloud.py -q
      - name: Bootstrap plan without GPU
        run: python scripts/install.py --profile cloud --json
      - name: Linux shell entry point
        if: runner.os == 'Linux'
        run: |
          for script in install.sh scripts/build_docker.sh scripts/setup_cloud_gpu.sh docker/entrypoint.web.sh; do bash -n "$script"; done
          bash install.sh --profile cloud --json
      - name: Linux clean environment smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libsndfile1 libgl1 libglib2.0-0
          bash install.sh --profile cloud --install
          workspace_data/runtime/app/bin/python -c "from fastapi.testclient import TestClient; from krvoiceai.web.server import create_app; client=TestClient(create_app()); assert client.get('/').status_code == 200; assert client.get('/api/installation').json()['profile'] == 'cloud'"
      - name: Windows entry point
        if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 --profile cloud --json
