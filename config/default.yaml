# B-roll 自动生成（空镜混剪，对标参考级口播成片的"不是从头到尾一张脸"）
# 流程：LLM 把文案切成 口播段/空镜段 → Seedance 云端生成空镜 → 现有 BRollEngine 叠加
# 默认关：开启需配置 VIDEO_API_BASE、VIDEO_API_KEY 和 VIDEO_MODEL
broll_auto:
  enabled: false
  # 旧版配置兼容字段；中转站的 VIDEO_MODEL 优先
  model: seedance-2.0-mini
  # 每条视频最多自动插入几段空镜
  max_clips: 3
  # 每段空镜时长（秒，Seedance 按秒计费，别设大）
  clip_duration: 5
  # 空镜分辨率
  resolution: 720p
  # 插入模式：cut（整段切换，数字人暂离）/ pip（画中画）
  mode: cut
  # 任务轮询间隔与总超时（秒）
  poll_interval: 10
  poll_timeout: 600

# 多景别切换（零成本提升节奏感：同一口播视频裁近景/中景两个机位，按段落切换）
# 纯 ffmpeg 裁切+缩放，CPU 轻量操作，任意机器可用
multicam:
  enabled: false
  # 切换间隔（秒）：每隔约多少秒切一次景别（实际按句子边界对齐）
  switch_interval: 12
  # 近景裁切比例（裁掉四周的比例，0.25 = 放大到 1.33x）
  closeup_crop: 0.25
  # 切换处轻微渐变帧数（0=硬切，抖音节奏建议硬切）
  fade_frames: 0

# 视频合成配置
composer:
  ffmpeg_path: ffmpeg  # 可指定绝对路径
  # 输出参数
  output_fps: 30
  output_resolution: [1080, 1920]
  video_bitrate: "8M"
  audio_bitrate: "192k"
  # BGM 库
  bgm_dir: ./config/bgm
  bgm_volume: 0.15  # BGM 音量（0-1）

# 封面生成配置
cover:
  mode: frame_overlay  # frame_overlay / sdxl / template
  # 布局：bottom(人物上2/3+标题下1/3，口播标准) / center / top / full
  layout: bottom
  # 模板目录
  templates_dir: ./config/cover_templates
  # 字体（空则用系统粗体中文）
  font_path: ""
  # 标题最大字数
  title_max_chars: 18

# 发布配置
publisher:
  mode: semi_auto  # auto / semi_auto / manual
  # Cookie 存储目录
  cookies_dir: ./config/cookies
  # 平台配置
  platforms:
    bilibili:
      # 注意：B站"真实上传"当前未启用——依赖 bilibili-api-python 未安装。
      # 未安装时运行到该路径会跳过并在日志给出原因；
      # 如需启用：pip install bilibili-api-python
      enabled: true
      api_base: https://api.bilibili.com
    douyin:
      enabled: false
      method: playwright
    kuaishou:
      enabled: false
      method: playwright
    wechat_video:
      enabled: false
      method: playwright
  # 发布间隔（秒），避免频率限制
  publish_interval: 60

# 文案原创度与风控配置（script_write 之后检测）
originality:
  # 是否启用（关闭则跳过该步骤）
  enabled: true
  # SimHash 查重相似度阈值（0~1，≥ 视为重复，0.85 约等于海明距离 9 位）
  simhash_threshold: 0.85
  # 历史文案库（SQLite，自动创建）
  history_db: ./workspace_data/originality_history.db
  # 违禁词库文件（用户可编辑）
  banned_words_file: ./config/banned_words.txt
  # 命中违禁词时最多报告多少个
  banned_words_max_report: 10
  # 是否启用 LLM 语义级风控（mock 模式自动跳过）
  llm_risk_check: true
  # 命中违禁词时是否自动调 LLM 修正（替换为合规表达，避免流程卡死）
  auto_fix_banned: true

# 编排配置
pipeline:
  # 任务数据库
  db_path: ./workspace_data/jobs.db
  # 最大重试次数
  max_retries: 3
  # 重试退避基数（秒）
  retry_backoff: 5
  # 并发数
  concurrency: 1
  # 是否启用 GPU 模块（false 时使用 mock）
  gpu_enabled: false

# GPU 调度配置
gpu_runner:
  # 云 GPU 服务地址（TTS + Avatar API）
  tts_endpoint: http://localhost:9880
  avatar_endpoint: http://localhost:8010
  # 健康检查超时
  health_check_timeout: 10
