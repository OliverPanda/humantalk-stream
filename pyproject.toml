[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freevideoai"
version = "0.1.0"
description = "FreeVideoAI 口播工坊 - 开源数字人口播视频工作室（本地可跑/按显卡分档/云端引擎可选）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FreeVideoAI contributors" }]

dependencies = [
    # 基础
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    # 日志
    "loguru>=0.7",
    # HTTP
    "requests>=2.31",
    "httpx>=0.25",
    "filelock>=3.12",
    "modelscope==1.34.0",
    "edge-tts>=7.3.1",
    # 媒体
    "ffmpeg-python>=0.2",
    "Pillow>=10.0",
    "numpy>=1.24",
    # LLM
    "openai>=2.11",
    # 下载
    "yt-dlp>=2024.0",
    # 无头浏览器（抖音文案提取，用系统已装的 Edge/Chrome，无需下载 Chromium）
    "playwright>=1.40",
    # 界面
    "gradio>=4.0",
    # 任务
    "rq>=1.16",
    # 工具
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1",
]
gpu = [
    # GPU 模块按需在云端安装，本地不强制
    "torch>=2.1",
    "torchaudio>=2.1",
]
tts = [
    "edge-tts>=7.3.1",  # CPU 降级方案（保留安装 extra 兼容）
]
# 本地增强层（纯 CPU 友好，MX450 2GB 显存可跑）
local = [
    "faster-whisper==1.2.1",  # Pro: 本地 Whisper small，多语言 CPU int8
    "jieba>=0.42",  # 文案查重 SimHash 中文分词
]
# 云端 GPU 服务依赖（在云 GPU 机器上安装，本地无需）
cloud = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
publish = [
    "bilibili-api-python>=17",
]

[project.scripts]
krvoiceai = "krvoiceai.ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["krvoiceai*"]

[tool.setuptools.package-data]
"krvoiceai.core" = ["pro_models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
